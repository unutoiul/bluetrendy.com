<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website intros · BlueTrendy Intelligence</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 Inter, "Segoe UI", sans-serif; color: #eaf6ff; background: #000628 }
    * { box-sizing: border-box }
    body { margin: 0 }
    main { max-width: 1040px; margin: auto; padding: clamp(22px, 5vw, 64px) 20px 36px }
    h1 { margin: 0 0 20px; font-size: clamp(1.4rem, 4vw, 2.1rem); font-weight: 550; letter-spacing: -.035em }
    .stage { position: relative; background: #071727; border-radius: 14px; overflow: hidden; border: 1px solid #243749; aspect-ratio: 16 / 9 }
    video, iframe { display: block; width: 100%; height: 100%; border: 0; object-fit: contain }
    [hidden] { display: none !important }
    button { font: inherit; color: inherit; cursor: pointer }
    button:focus-visible { outline: 3px solid #91d5ff; outline-offset: 2px }
    .sound { position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); white-space: nowrap; border: 1px solid #537a96; border-radius: 24px; padding: 8px 16px; font-size: .86rem; background: #112c41 }
    .choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0 0 }
    .choices button { border: 1px solid #273e51; border-radius: 9px; text-align: left; padding: 12px 16px; background: #0b1d2c; font-weight: 600 }
    .choices button:hover { background: #112b40 }
    .choices button[aria-pressed="true"] { border-color: #5fb9fa; background: #102d43 }
    small { display: block; color: #b0c5d5; font-size: .78rem; font-weight: 400 }
    #status { color: #bfd4e4 }
    @media (max-width: 550px) {
      main { padding: 24px 12px }
      .stage:has(iframe:not([hidden])) { aspect-ratio: 1 / 1 }
      .choices { grid-template-columns: 1fr }
      .choices button { display: flex; justify-content: space-between; align-items: baseline }
      .sound { bottom: 7%; padding: 6px 12px }
    }
  </style>
</head>
<body>
  <main>
    <h1>BlueTrendy website intros</h1>
    <div class="stage">
      <iframe src="../../intro.html" title="The Shadow Arrives First" allow="autoplay; fullscreen" allowfullscreen></iframe>
      <video controls playsinline preload="metadata" width="1920" height="1080" hidden></video>
      <button class="sound" hidden>Play intro with sound</button>
    </div>
    <div class="choices" role="group" aria-label="Choose an intro to play">
      <button data-intro aria-pressed="true"><span>The Shadow Arrives First</span><small>Kling 3.0 Pro</small></button>
      <button data-file="inside-the-b.mp4" aria-pressed="false"><span>Inside the B</span><small>FLUX 3 Max</small></button>
      <button data-file="the-vortex.mp4" aria-pressed="false"><span>The Vortex</span><small>Seedance 2.5</small></button>
      <button data-file="the-alignment.mp4" aria-pressed="false"><span>The Alignment</span><small>Wan 3.0 Prime</small></button>
    </div>
    <p id="status" role="status"></p>
  </main>
  <script>
    const frame = document.querySelector('iframe');
    const video = document.querySelector('video');
    const sound = document.querySelector('.sound');
    const choices = Array.from(document.querySelectorAll('.choices button'));
    const status = document.getElementById('status');
    let selection = 0;

    async function playWithSound() {
      const current = ++selection;
      video.muted = false;
      try {
        await video.play();
        if (selection === current) sound.hidden = true;
      } catch (error) {
        if (selection !== current || error.name === 'AbortError') return;
        if (error.name === 'NotAllowedError') sound.hidden = false;
        else status.textContent = 'Playback failed. Select the intro to try again.';
      }
    }
    choices.forEach(choice => choice.addEventListener('click', () => {
      ++selection;
      choices.forEach(item => item.setAttribute('aria-pressed', String(item === choice)));
      status.textContent = '';
      sound.hidden = true;
      const showKling = choice.hasAttribute('data-intro');
      video.hidden = showKling;
      frame.hidden = !showKling;
      if (showKling) {
        video.pause();
        frame.src = '../../intro.html';
        return;
      }
      if (frame.hasAttribute('src')) frame.removeAttribute('src');
      video.setAttribute('aria-label', choice.querySelector('span').textContent);
      if (video.getAttribute('src') !== choice.dataset.file || video.error) video.src = choice.dataset.file;
      else video.currentTime = 0;
      playWithSound();
    }));
    sound.addEventListener('click', playWithSound);
    video.addEventListener('playing', () => { sound.hidden = true; });
  </script>
</body>
</html>
